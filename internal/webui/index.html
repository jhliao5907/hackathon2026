<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbx 安全沙箱</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e6e8ec; --mut:#9aa3b2;
    --accent:#5b8cff; --ok:#38c172; --warn:#e0a106; --danger:#e5534b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft Yahei",sans-serif}
  .wrap{max-width:720px;margin:32px auto;padding:0 16px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 24px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--mut);font-weight:600;letter-spacing:.3px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  label.opt{display:flex;align-items:center;gap:8px;cursor:pointer}
  .agent{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;margin-right:10px}
  .agent.sel{border-color:var(--accent);background:rgba(91,140,255,.12)}
  .mcp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .mcp .top{display:flex;align-items:flex-start;gap:10px}
  .mcp .meta{flex:1}
  .mcp .name{font-weight:600}
  .mcp .desc{color:var(--mut);font-size:13px}
  .secret{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .secret .lbl{min-width:120px;color:var(--mut);font-size:13px}
  input[type=password],input[type=text]{background:#0e1016;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:7px 10px;flex:1;min-width:160px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px}
  .badge.ok{background:rgba(56,193,114,.15);color:var(--ok)}
  .badge.no{background:rgba(224,161,6,.15);color:var(--warn)}
  .allow{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;background:#0e1016;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--mut)}
  .actions{display:flex;gap:12px;align-items:center;margin-top:8px}
  .launch{background:var(--ok);font-size:15px;padding:11px 22px}
  #status{margin-top:12px;font-size:13px;white-space:pre-wrap;color:var(--mut)}
  code{background:#0e1016;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 16px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.sel{color:var(--fg);border-bottom-color:var(--accent)}
  .auditlist{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:60vh;overflow:auto}
  .ev{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid #1e2129;white-space:nowrap}
  .ev .t{color:var(--mut)}
  .ev .k{min-width:62px;font-weight:600}
  .ev.egress .k{color:#5b8cff}.ev.mcp .k{color:#38c172}.ev.llm .k{color:#c48cff}.ev.secret .k{color:#e0a106}
  .ev .d{color:var(--fg);white-space:normal;word-break:break-all}
  .allowT{color:#38c172}.denyT{color:#e5534b}
  .chip.custom{border-color:var(--accent);color:var(--fg)}
  .chip.custom b{color:var(--mut);cursor:pointer;margin-left:6px;font-weight:700}
  .cmcp{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .cmcp .r{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .cmcp .r .lbl{min-width:84px;color:var(--mut);font-size:13px}
  .cmcp .rm{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--danger);padding:4px 10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>sbx 安全沙箱</h1>
  <p class="sub">勾选要用的能力、填入密钥，一键在隔离沙箱里启动 AI agent。密钥只存在本机系统钥匙串，绝不进入沙箱。</p>

  <div class="tabs">
    <span class="tab sel" data-view="config">配置</span>
    <span class="tab" data-view="audit">审计日志</span>
  </div>

  <div id="view-config">
  <div class="card">
    <h2>选择 AGENT</h2>
    <div id="agents" class="row"></div>
  </div>

  <div class="card">
    <h2>模型服务地址（OpenAI / Anthropic 兼容，可填自建或第三方网关）</h2>
    <div class="secret">
      <span class="lbl">base URL</span>
      <input type="text" id="baseUrl" placeholder="如 https://llmapi.qiniu.io/v1">
    </div>
    <div class="secret">
      <span class="lbl">模型（可选）</span>
      <input type="text" id="model" placeholder="第三方网关需填其支持的模型，如 claude-opus-4-8；官方可留空">
    </div>
    <div class="desc" style="margin-top:6px;color:var(--mut);font-size:12px">留空用 agent 默认模型；第三方网关常只开通部分模型，需显式指定一个它支持的。</div>
  </div>

  <div class="card">
    <h2>模型密钥（不进沙箱，由宿主机注入）</h2>
    <div id="agentSecret"></div>
  </div>

  <div class="card">
    <h2>MCP 服务</h2>
    <div id="mcps"></div>
    <div id="customMcps"></div>
    <button class="ghost" id="addMcp" style="margin-top:12px;padding:6px 12px;font-size:13px">+ 添加自定义 MCP</button>
  </div>

  <div class="card">
    <h2>出网白名单（按所选自动汇总，其余一律拒绝）</h2>
    <div id="allow" class="allow"></div>
    <div class="secret" style="margin-top:12px">
      <input type="text" id="allowInput" placeholder="添加自定义域名，如 example.com（子域名自动覆盖）">
      <button class="ghost" id="addAllow">添加</button>
    </div>
  </div>

  <div class="actions">
    <button class="ghost" id="save">保存配置</button>
    <button class="launch" id="launch">启动沙箱 ▶</button>
  </div>
  <div id="status"></div>
  </div><!-- /view-config -->

  <div id="view-audit" hidden>
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:12px">审计日志（实时）
        <label class="opt" style="font-weight:400;font-size:12px"><input type="checkbox" id="autoref" checked> 自动刷新</label>
        <button class="ghost" id="refresh" style="padding:4px 10px;font-size:12px">刷新</button>
        <span id="auditInfo" class="desc" style="font-size:12px;margin-left:auto"></span>
      </h2>
      <div id="auditList" class="auditlist"></div>
    </div>
  </div>
</div>

<script>
let S = null;              // 服务端状态
let agent = null;          // 当前 agent key
const enabled = new Set(); // 启用的 MCP key
let cmcps = [];            // 自定义 MCP: {name,image,command,secEnv,secKey,secSet}
const callow = new Set();  // 自定义白名单域名

const $ = s => document.querySelector(s);
const el = (t, props={}, kids=[]) => {
  const n = document.createElement(t);
  Object.entries(props).forEach(([k,v]) => k==='class'?n.className=v:k==='html'?n.innerHTML=v:n.setAttribute(k,v));
  (Array.isArray(kids)?kids:[kids]).forEach(c=>c&&n.append(c));
  return n;
};
const status = (msg, color) => { const s=$('#status'); s.textContent=msg; s.style.color=color||'var(--mut)'; };

function badge(set){ return el('span',{class:'badge '+(set?'ok':'no'), html:set?'已设置':'未设置'}); }

function secretRow(keyName, label){
  const b = badge(S.secrets[keyName]);
  const inp = el('input',{type:'password',placeholder:'粘贴 '+label+'，留空则不改动'});
  const btn = el('button',{},'保存密钥');
  btn.onclick = async () => {
    if(!inp.value){ status('请输入 '+label,'var(--warn)'); return; }
    btn.disabled=true;
    const r = await fetch('/api/secret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:keyName,value:inp.value})});
    btn.disabled=false;
    if(r.ok){ S.secrets[keyName]=true; b.className='badge ok'; b.textContent='已设置'; inp.value=''; status('已存入钥匙串：'+keyName,'var(--ok)'); }
    else status('保存失败','var(--danger)');
  };
  return el('div',{class:'secret'},[el('span',{class:'lbl'},label), b, inp, btn]);
}

function renderAgentSecret(){
  const box = $('#agentSecret'); box.innerHTML='';
  (S.agentSecrets[agent]||[]).forEach(name => box.append(secretRow(name, name)));
  if(!(S.agentSecrets[agent]||[]).length) box.append(el('div',{class:'desc'},'该 agent 无需额外模型密钥'));
}

function renderAgents(){
  const box = $('#agents'); box.innerHTML='';
  S.agents.forEach(a => {
    const node = el('span',{class:'agent'+(a.key===agent?' sel':'')}, a.display);
    node.onclick = () => { agent=a.key; $('#baseUrl').value=S.baseURL[agent]||''; $('#model').value=S.model[agent]||''; renderAgents(); renderAgentSecret(); renderAllow(); };
    box.append(node);
  });
}

function hostOf(u){ try{ return new URL(u).hostname; }catch(e){ return ''; } }

function renderMCPs(){
  const box = $('#mcps'); box.innerHTML='';
  S.mcpPresets.forEach(p => {
    const cb = el('input',{type:'checkbox'}); cb.checked=enabled.has(p.key);
    cb.onchange = () => { cb.checked?enabled.add(p.key):enabled.delete(p.key); renderAllow(); };
    const top = el('div',{class:'top'},[cb, el('div',{class:'meta'},[
      el('div',{class:'name'},p.display), el('div',{class:'desc'},p.desc)
    ])]);
    const card = el('div',{class:'mcp'},[top]);
    (p.secrets||[]).forEach(s => card.append(secretRow(s.keyName, s.label)));
    box.append(card);
  });
}

function renderAllow(){
  const box = $('#allow'); box.innerHTML='';
  const set = new Set(['registry.npmjs.org']);
  const h = hostOf($('#baseUrl').value); if(h) set.add(h);
  const a = S.agents.find(x=>x.key===agent); (a&&a.alwaysAllow||[]).forEach(d=>set.add(d));
  S.mcpPresets.filter(p=>enabled.has(p.key)).forEach(p=>(p.allowlist||[]).forEach(d=>set.add(d)));
  [...set].sort().forEach(d=>box.append(el('span',{class:'chip'},d)));
  // 自定义域名（可删除）
  [...callow].sort().forEach(d=>{
    const x = el('b',{},'×'); x.onclick=()=>{ callow.delete(d); renderAllow(); };
    box.append(el('span',{class:'chip custom'},[document.createTextNode(d), x]));
  });
}

function renderCustomMcps(){
  const box = $('#customMcps'); box.innerHTML='';
  cmcps.forEach((c,i)=>{
    const mk=(ph,val,key)=>{ const inp=el('input',{type:'text',placeholder:ph}); inp.value=val||''; inp.oninput=()=>{c[key]=inp.value;}; return inp; };
    const rm = el('button',{class:'rm'},'删除'); rm.onclick=()=>{ cmcps.splice(i,1); renderCustomMcps(); };
    const rows = [
      el('div',{class:'r'},[el('span',{class:'lbl'},'名称'), mk('如 my-tool',c.name,'name'), rm]),
      el('div',{class:'r'},[el('span',{class:'lbl'},'命令'), mk('如 npx -y some-mcp-server',c.command,'command')]),
      el('div',{class:'r'},[el('span',{class:'lbl'},'镜像(可选)'), mk('默认 node:20-slim',c.image,'image')]),
    ];
    // 可选一个密钥
    const envi = mk('环境变量名(可选)，如 API_KEY', c.secEnv,'secEnv');
    const vali = el('input',{type:'password',placeholder: c.secSet?'已设置，留空不改':'密钥值(可选)'});
    vali.oninput=()=>{ c.secVal=vali.value; };
    rows.push(el('div',{class:'r'},[el('span',{class:'lbl'},'密钥'), envi, vali]));
    box.append(el('div',{class:'cmcp'}, rows));
  });
}

function buildCustomMcpPayload(){
  const out=[];
  cmcps.forEach(c=>{
    const name=(c.name||'').trim(); const command=(c.command||'').trim();
    if(!name||!command) return;
    const secrets=[];
    const env=(c.secEnv||'').trim();
    if(env){
      const keyName = c.secKey || ('custom-'+name.toLowerCase().replace(/[^a-z0-9_-]/g,'')+'-'+env.toLowerCase().replace(/[^a-z0-9_-]/g,''));
      secrets.push({env, keyName, value: c.secVal||''});
    }
    out.push({name, image:(c.image||'').trim(), command, secrets});
  });
  return out;
}

async function save(){
  const baseUrl = $('#baseUrl').value.trim();
  const model = $('#model').value.trim();
  const payload = {agent,enabled:[...enabled],baseUrl,model,customMcp:buildCustomMcpPayload(),customAllow:[...callow]};
  const r = await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.ok){ status('已生成 sandbox.yaml（不含任何密钥）','var(--ok)'); return true; }
  status('保存配置失败','var(--danger)'); return false;
}

async function launch(){
  if(!await save()) return;
  const r = await fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent,enabled:[...enabled]})});
  const d = await r.json();
  if(!d.ok){ status('以下密钥尚未设置，请先填写：'+d.missing.join('、'),'var(--warn)'); return; }
  if(d.launched) status('已在新终端窗口启动沙箱 ✓\n如未看到窗口，请在终端运行：\n  '+d.command,'var(--ok)');
  else status('未能自动打开终端'+(d.error?'（'+d.error+'）':'')+'。请手动在终端运行：\n  '+d.command,'var(--warn)');
}

// ---- 审计日志页 ----
let auditTimer = null;
function fmtEvent(e){
  const row = el('div',{class:'ev '+(e.type||'')});
  row.append(el('span',{class:'t'}, (e.time||'').replace('T',' ').replace(/\+.*/,'')));
  row.append(el('span',{class:'k'}, e.type||'?'));
  let d='';
  if(e.type==='egress') d = `<span class="${e.decision==='allow'?'allowT':'denyT'}">${e.decision.toUpperCase()}</span> ${e.method||''} ${e.host||''}`;
  else if(e.type==='mcp') d = `${e.server||''} · ${e.method||''}${e.rpc_id?(' #'+e.rpc_id):''}`;
  else if(e.type==='llm') d = `${e.server||''} · ${e.detail||''}`;
  else if(e.type==='secret') d = `注入密钥 ${e.secret||''}${e.server?(' → '+e.server):''}`;
  else d = JSON.stringify(e);
  row.append(el('span',{class:'d',html:d}));
  return row;
}
async function loadAudit(){
  try{
    const d = await (await fetch('/api/audit')).json();
    const box = $('#auditList'); box.innerHTML='';
    if(!d.exists){ $('#auditInfo').textContent='暂无日志（启动沙箱后产生）'; return; }
    const evs = (d.events||[]).map(x=>typeof x==='string'?JSON.parse(x):x);
    $('#auditInfo').textContent = evs.length+' 条';
    evs.forEach(e=>box.append(fmtEvent(e)));
    box.scrollTop = box.scrollHeight;
  }catch(e){ $('#auditInfo').textContent='读取失败'; }
}
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('sel', t.dataset.view===v));
  $('#view-config').hidden = v!=='audit' ? false : true;
  $('#view-audit').hidden = v!=='audit';
  if(v==='audit'){ loadAudit(); startAuto(); } else { stopAuto(); }
}
function startAuto(){ stopAuto(); if($('#autoref').checked) auditTimer=setInterval(loadAudit,1500); }
function stopAuto(){ if(auditTimer){ clearInterval(auditTimer); auditTimer=null; } }

async function init(){
  S = await (await fetch('/api/state')).json();
  agent = S.selected.agent || S.agents[0].key;
  (S.selected.enabled||[]).forEach(k=>enabled.add(k));
  (S.customAllow||[]).forEach(d=>callow.add(d));
  cmcps = (S.customMcp||[]).map(c=>({name:c.name,image:c.image,command:c.command,
    secEnv:(c.secrets&&c.secrets[0]&&c.secrets[0].env)||'', secKey:(c.secrets&&c.secrets[0]&&c.secrets[0].keyName)||'',
    secSet:!!(c.secrets&&c.secrets[0]&&S.secrets[c.secrets[0].keyName])}));
  $('#baseUrl').value = S.baseURL[agent] || '';
  $('#model').value = S.model[agent] || '';
  $('#baseUrl').oninput = renderAllow;
  renderAgents(); renderAgentSecret(); renderMCPs(); renderCustomMcps(); renderAllow();
  $('#save').onclick = save;
  $('#launch').onclick = launch;
  $('#addMcp').onclick = ()=>{ cmcps.push({}); renderCustomMcps(); };
  $('#addAllow').onclick = ()=>{ const v=$('#allowInput').value.trim().toLowerCase(); if(v){ callow.add(v); $('#allowInput').value=''; renderAllow(); } };
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));
  $('#refresh').onclick = loadAudit;
  $('#autoref').onchange = startAuto;
  if(location.hash==='#audit') switchView('audit');
}
init();
</script>
</body>
</html>
