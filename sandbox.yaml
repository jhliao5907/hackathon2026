# 本文件由 sbx 生成，不含任何敏感值（密钥存于系统 Keychain）。
allowlist:
    - api.github.com
    - api.openai.com
    - registry.npmjs.org
mcpServers:
    github:
        image: node:20-slim
        command:
            - npx
            - -y
            - '@modelcontextprotocol/server-github'
        secrets:
            GITHUB_PERSONAL_ACCESS_TOKEN: gh-token
llmProxies:
    openai:
        target: https://api.openai.com
        clientEnv:
            OPENAI_API_KEY: sandbox-placeholder
        headers:
            Authorization: Bearer ${openai-key}
