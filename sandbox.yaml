# 本文件由 sbx 生成，不含任何敏感值（密钥存于系统 Keychain）。
allowlist:
    - api.github.com
    - llmapi.qiniu.io
    - registry.npmjs.org
mcpServers:
    github:
        image: ghcr.io/github/github-mcp-server:latest
        command:
            - stdio
        secrets:
            GITHUB_PERSONAL_ACCESS_TOKEN: gh-token
llmProxies:
    openai:
        target: https://llmapi.qiniu.io
        clientEnv:
            OPENAI_API_KEY: sandbox-placeholder
        headers:
            Authorization: Bearer ${openai-key}
