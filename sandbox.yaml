# 本文件由 sbx 生成，不含任何敏感值（密钥存于系统 Keychain）。
allowlist:
    - api.fenno.ai
    - api.github.com
    - registry.npmjs.org
mcpServers:
    github:
        image: ghcr.io/github/github-mcp-server:latest
        command:
            - stdio
        secrets:
            GITHUB_PERSONAL_ACCESS_TOKEN: gh-token
llmProxies:
    anthropic:
        target: https://api.fenno.ai
        clientEnv:
            ANTHROPIC_API_KEY: sandbox-placeholder
            ANTHROPIC_BASE_URL: '{proxy}'
            ANTHROPIC_MODEL: claude-opus-4-8
            ANTHROPIC_SMALL_FAST_MODEL: claude-opus-4-8
        headers:
            x-api-key: anthropic-key
